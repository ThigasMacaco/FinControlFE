<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinControl — Categorias</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
</head>
<body>
  <div id="sidebar-slot"></div>

  <div class="main">
    <div id="topbar-slot"></div>

    <div class="page-content">
      <div class="container" style="max-width:980px;">
        <div class="empty-card">
          <h2 style="color:var(--azul);margin-bottom:8px;">Categorias</h2>
          <p style="color:var(--cinza);margin-bottom:14px;">CRUD mínimo: GET/POST/DELETE para <b>/api/categorias</b>.</p>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label style="display:block;font-size:.8rem;font-weight:800;margin-bottom:6px;">Nome</label>
              <input id="cat-nome" placeholder="Ex.: Alimentação" />
            </div>
            <div>
              <label style="display:block;font-size:.8rem;font-weight:800;margin-bottom:6px;">Tipo</label>
              <select id="cat-tipo">
                <option value="ambos">Ambos</option>
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
              </select>
            </div>
          </div>

          <div style="margin-top:14px;display:flex;gap:12px;align-items:center;justify-content:flex-end;">
            <button class="btn btn-outline" type="button" onclick="logout()"><i class="fa fa-sign-out-alt"></i> Sair</button>
            <button class="btn btn-primary" type="button" onclick="criar()"><i class="fa fa-plus"></i> Criar</button>
            <button class="btn btn-outline" type="button" onclick="carregar()"><i class="fa fa-search"></i> Listar</button>
          </div>

          <div id="resultado" style="margin-top:18px;color:var(--cinza);">Carregue após plugar back-end.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./app.js"></script>
  <script src="./ui.js"></script>
  <script>
    exigirLogin();
    iniciarLayout('categorias');

    async function carregar() {
      const box = document.getElementById('resultado');
      box.textContent = 'Carregando...';
      try {
        const data = await api('/categorias');
        box.textContent = Array.isArray(data) ? `Encontradas ${data.length} categorias.` : 'Resposta inesperada do servidor.';
      } catch (e) {
        box.textContent = e.message;
      }
    }

    async function criar() {
      const nome = document.getElementById('cat-nome').value.trim();
      const tipo = document.getElementById('cat-tipo').value;
      if (!nome) {
        toast('Informe o nome da categoria.', 'erro');
        return;
      }

      try {
        await api('/categorias', {
          method: 'POST',
          body: JSON.stringify({ nome, tipo })
        });
        toast('Categoria criada!', 'sucesso');
        await carregar();
      } catch (e) {
        toast(e.message || 'Erro ao criar categoria', 'erro');
      }
    }

    carregar();
  </script>
</body>
</html>
