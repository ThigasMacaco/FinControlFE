<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinControl — Relatórios</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
</head>
<body>
  <div id="sidebar-slot"></div>
  <div class="main">
    <div id="topbar-slot"></div>

    <div class="page-content">
      <div class="container" style="max-width:980px;">
        <div class="empty-card">
          <h2 style="color:var(--azul);margin-bottom:8px;">Relatórios</h2>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label style="display:block;font-size:.8rem;font-weight:800;margin-bottom:6px;">Tipo</label>
              <select id="r-tipo">
                <option value="receita">Receitas</option>
                <option value="despesa">Despesas</option>
                <option value="ambos" selected>Ambos</option>
              </select>
            </div>
            <div>
              <label style="display:block;font-size:.8rem;font-weight:800;margin-bottom:6px;">Mês</label>
              <input id="r-mes" placeholder="(opcional) 1-12" />
            </div>
          </div>

          <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label style="display:block;font-size:.8rem;font-weight:800;margin-bottom:6px;">Ano</label>
              <input id="r-ano" placeholder="(opcional) 2026" />
            </div>
            <div>
              <label style="display:block;font-size:.8rem;font-weight:800;margin-bottom:6px;">Categoria ID</label>
              <input id="r-cat" placeholder="(opcional) número" />
            </div>
          </div>

          <div style="margin-top:14px;display:flex;gap:12px;align-items:center;justify-content:flex-end;">
            <button class="btn btn-outline" type="button" onclick="logout()"><i class="fa fa-sign-out-alt"></i> Sair</button>
            <button class="btn btn-primary" type="button" onclick="carregar()"><i class="fa fa-search"></i> Gerar</button>
          </div>

          <div id="resultado" style="margin-top:18px;color:var(--cinza);">Carregue após plugar back-end.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./app.js"></script>
  <script src="./ui.js"></script>
  <script>
    exigirLogin();
    iniciarLayout('relatorios');

    async function carregar() {
      const tipo = document.getElementById('r-tipo').value;
      const mes = document.getElementById('r-mes').value.trim();
      const ano = document.getElementById('r-ano').value.trim();
      const categoria_id = document.getElementById('r-cat').value.trim();

      const params = new URLSearchParams();
      if (tipo && tipo !== 'ambos') params.set('tipo', tipo);
      if (mes) params.set('mes', mes);
      if (ano) params.set('ano', ano);
      if (categoria_id) params.set('categoria_id', categoria_id);

      const box = document.getElementById('resultado');
      box.textContent = 'Carregando...';
      try {
        const data = await api(`/relatorio?${params.toString()}`);
        const totalReceitas = data.total_receitas ?? 0;
        const totalDespesas = data.total_despesas ?? 0;
        const saldo = data.saldo ?? (totalReceitas - totalDespesas);
        box.innerHTML = `Receitas: <b>${formatMoeda(totalReceitas)}</b> | Despesas: <b>${formatMoeda(totalDespesas)}</b> | Saldo: <b>${formatMoeda(saldo)}</b>`;
      } catch (e) {
        box.textContent = e.message;
      }
    }

    carregar();
  </script>
</body>
</html>
